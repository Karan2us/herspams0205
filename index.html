<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Babygirl🎀 💖</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Quicksand:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- 🎵 Background Music -->
  <audio autoplay loop>
    <source src="assets/pnb.mp3" type="audio/mp3" />
  </audio>

  <!-- Floating image background -->
  <div id="tsparticles"></div>

  <!-- Main Content -->
  <div class="content">
    <h1 class="main-heading">Happy Birthday Babygirl🎀</h1>

    <div class="dob-card-wrapper">
      <div class="dob-card">
        <div class="dob-number">02</div>
        <div class="dob-label left">FRI</div>
      </div>
      <div class="dob-card">
        <div class="dob-number">MAY</div>
        <div class="dob-label right">MONTH</div>
      </div>
    </div>

    <!-- Next Page Button -->
    <a href="page2.html" class="next-button">Next Page →</a>
  </div>

  <!-- tsParticles Script -->
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1/tsparticles.bundle.min.js"></script>
  <script>
    const images = [
      "photo_2025-04-30_22-33-54.jpg",
      "photo_2025-04-30_22-34-00.jpg",
      "photo_2025-04-30_22-45-27.jpg",
      "photo_2025-04-30_22-45-38.jpg",
      "photo_2025-04-30_22-45-41.jpg",
      "photo_2025-04-30_22-45-45.jpg",
      "photo_2025-05-01_15-26-18.jpg",
      "photo_2025-05-01_15-26-21.jpg",
      "photo_2025-05-01_15-26-24.jpg",
      "photo_2025-05-01_15-26-27.jpg",
      "photo_2025-05-01_15-34-45.jpg",
      "photo_2025-05-01_15-34-47.jpg",
      "photo_2025-05-01_15-34-51.jpg",
      "photo_2025-04-30_22-45-51.jpg",
      "photo_2025-04-30_22-45-54.jpg",
      "photo_2025-04-30_22-45-58.jpg",
      "photo_2025-04-30_22-34-02.jpg",
      "photo_2025-04-30_22-34-05.jpg",
      "photo_2025-04-30_22-45-30.jpg",
      "photo_2025-04-30_22-45-35.jpg"
    ];

    const particles = images.map((src) => ({
      position: {
        x: Math.random() * 100,
        y: Math.random() * 100
      },
      options: {
        shape: {
          type: "image",
          image: {
            src: "assets/" + src,
            width: 50,
            height: 50
          }
        },
        size: { value: 45 },
        move: {
          enable: true,
          speed: 0.3,
          direction: "top-right",
          straight: false,
          random: true,
          outModes: { default: "bounce" }
        },
        opacity: { value: 0.85 }
      }
    }));

    tsParticles.load("tsparticles", {
      fullScreen: { enable: true, zIndex: 0 },
      background: { color: "transparent" },
      manualParticles: particles,
      detectRetina: true
    });
  </script>
</body>
</html>
